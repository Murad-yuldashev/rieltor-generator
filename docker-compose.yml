services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rieltor
      POSTGRES_PASSWORD: rieltor
      POSTGRES_DB: rieltor
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rieltor']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://rieltor:rieltor@postgres:5432/rieltor
      PUBLIC_BASE_URL: http://localhost:3000
      SEED_AGENT_TEL: ${SEED_AGENT_TEL}
      SEED_AGENT_TG: ${SEED_AGENT_TG}
      PORT: 3000
      # env.ts requires these; defaults let `docker compose up` and the CI e2e job
      # boot without a real secret. Override with real values in production.
      JWT_SECRET: ${JWT_SECRET:-dev-compose-jwt-secret-at-least-32-characters}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-dev-compose-bot-token}
    ports: ['3000:3000']

volumes:
  pgdata:
