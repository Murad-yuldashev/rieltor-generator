services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rieltor
      POSTGRES_PASSWORD: rieltor
      POSTGRES_DB: rieltor
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rieltor']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://rieltor:rieltor@postgres:5432/rieltor
      PUBLIC_BASE_URL: http://localhost:3000
      SEED_AGENT_TEL: ${SEED_AGENT_TEL}
      SEED_AGENT_TG: ${SEED_AGENT_TG}
      PORT: 3000
      # Demo rejim: kabinet login'siz ochiladi — har so'rov bitta umumiy "demo" rieltor
      # sifatida kiradi. Faqat namoyish uchun; real auth kerak bo'lsa "false" qiling.
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ['3000:3000']

volumes:
  pgdata:
