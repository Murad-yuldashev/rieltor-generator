name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rieltor
          POSTGRES_PASSWORD: rieltor
          POSTGRES_DB: rieltor
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://rieltor:rieltor@localhost:5432/rieltor
      PUBLIC_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: yarn }
      - run: yarn install --immutable
      - run: yarn playwright install --with-deps chromium
      - name: Stack'ni ko'tarish
        env:
          SEED_AGENT_TEL: '+998901234567'
          SEED_AGENT_TG: 'test'
        run: docker compose up -d --build
      - name: Servis tayyorligini kutish
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - run: yarn e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: playwright-report/ }
